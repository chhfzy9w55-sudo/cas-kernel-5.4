name: build-cas-image-with-drivers-v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 python3-pip xz-utils
          sudo apt-get install -y clang-14 lld-14 llvm-14
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "=== 验证 ==="
          which clang-14 || true
          which aarch64-linux-gnu-gcc || true
          echo "deps done"

      - name: Clone 5.4 kernel with retry
        run: |
          cd $GITHUB_WORKSPACE
          for i in 1 2 3; do
            echo "=== try $i/3 ==="
            rm -rf kernel54
            if git clone --depth=1 -b android11-5.4 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git kernel54 2>&1 | tail -3; then
              if [ -d kernel54/.git ]; then
                echo "cloned"
                break
              fi
            fi
            sleep 30
          done
          if [ ! -d kernel54/.git ]; then
            git clone --depth=1 -b android11-5.4 https://github.com/aosp-mirror/kernel_common.git kernel54
          fi
          ls kernel54/ | head -5

      - name: Fetch cas drivers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          for dir in drivers/input/misc/aw8697_haptic drivers/power/supply/cas_qcom; do
            mkdir -p "$dir"
            API_URL="https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents/$dir?ref=cas-q-oss"
            curl -sL "$API_URL" | grep '"name"' | awk -F'"' '{print $4}' | while read f; do
              curl -sL --max-time 60 -o "$dir/$f" "$BASE/$dir/$f" 2>/dev/null
            done
          done
          echo "=== aw8697 ==="
          ls drivers/input/misc/aw8697_haptic/ | head -10
          echo "=== cas_qcom ==="
          ls drivers/power/supply/cas_qcom/ | head -20

      - name: Fetch qcom headers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          mkdir -p include/linux
          curl -sL --max-time 60 -o include/linux/pmic-voter.h "$BASE/include/linux/pmic-voter.h" 2>/dev/null || true
          curl -sL --max-time 60 -o drivers/power/supply/pmic-voter.c "$BASE/drivers/power/supply/pmic-voter.c" 2>/dev/null || true

      - name: Patch power_supply.h
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          curl -sL --max-time 60 -o /tmp/ps_cas.h "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss/include/linux/power_supply.h"
          python3 << 'PYEOF'
          import re
          with open('/tmp/ps_cas.h') as f:
              cas = f.read()
          with open('include/linux/power_supply.h') as f:
              c54 = f.read()
          c54 = re.sub(r'\n*/\* cas 4\.19 vendor extensions \*/.*?\n\};\n?', '\n', c54, flags=re.DOTALL)
          pat = r'POWER_SUPPLY_[A-Z_0-9]+'
          diff = sorted(set(re.findall(pat, cas)) - set(re.findall(pat, c54)))
          print(f"diff: {len(diff)}")
          last_endif = c54.rfind('#endif')
          insertion = '\n/* cas 4.19 vendor extensions */\nenum cas_vendor_power_supply_ext {\n'
          for d in diff:
              insertion += '\t' + d + ',\n'
          insertion += '};\n\n'
          new_content = c54[:last_endif] + insertion + c54[last_endif:]
          with open('include/linux/power_supply.h', 'w') as f:
              f.write(new_content)
          print("inserted")
          PYEOF

      - name: Patch for 5.4
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          find drivers/input/misc/aw8697_haptic drivers/power/supply -name "*.c" -o -name "*.h" 2>/dev/null | while read f; do
            grep -q "asm/uaccess.h" "$f" 2>/dev/null && sed -i 's|<asm/uaccess.h>|<linux/uaccess.h>|g' "$f"
            if grep -q "do_gettimeofday" "$f" 2>/dev/null; then
              LAST=$(grep -n "^#include" "$f" | tail -1 | cut -d: -f1)
              head -${LAST} "$f" > /tmp/p.c
              echo '#include <linux/timekeeping.h>' >> /tmp/p.c
              echo '#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)' >> /tmp/p.c
              tail -n +$((${LAST}+1)) "$f" >> /tmp/p.c
              mv /tmp/p.c "$f"
            fi
          done

      - name: Hook Kconfig Makefile
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          echo 'source "drivers/input/misc/aw8697_haptic/Kconfig"' >> drivers/input/misc/Kconfig
          echo 'obj-$(CONFIG_INPUT_AW8697_HAPTIC) += aw8697_haptic/' >> drivers/input/misc/Makefile
          if [ -f drivers/power/supply/cas_qcom/Kconfig ]; then
            echo 'source "drivers/power/supply/cas_qcom/Kconfig"' >> drivers/power/supply/Kconfig
            echo 'obj-y += cas_qcom/' >> drivers/power/supply/Makefile
          fi
          if [ -f drivers/power/supply/pmic-voter.c ]; then
            echo 'obj-y += pmic-voter.o' >> drivers/power/supply/Makefile
          fi

      - name: Enable configs builtin
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          echo 'CONFIG_INPUT_AW8697_HAPTIC=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_QPNP_SMB5_CAS=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_CHARGER_BQ25790=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_FUEL_GAUGE_BQ28Z610=y' >> arch/arm64/configs/gki_defconfig
          echo 'CONFIG_CP_MAX77932=y' >> arch/arm64/configs/gki_defconfig
          make ARCH=arm64 gki_defconfig > /dev/null 2>&1
          grep -E "AW8697|SMB5_CAS|BQ25790|BQ28Z610|MAX77932" .config || true

      - name: Build Image
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image > build.log 2>&1
          RESULT=$?
          echo "build exit=$RESULT"
          ls -la arch/arm64/boot/Image 2>/dev/null
          ERRORS=$(grep -iE "error:|fatal error" build.log | head -30)
          {
            echo "## cas 5.4 Image build report"
            echo ""
            echo "### exit=$RESULT"
            echo ""
            echo "### errors"
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo ""
            echo "### Image"
            echo '```'
            ls -la arch/arm64/boot/Image 2>/dev/null || echo "no image"
            echo '```'
            echo ""
            echo "### last 40 lines"
            echo '```'
            tail -40 build.log
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: Commit Image
        if: success()
        run: |
          cd $GITHUB_WORKSPACE
          if [ -f kernel54/arch/arm64/boot/Image ]; then
            cp kernel54/arch/arm64/boot/Image ./Image_cas_5.4_with_drivers
            ls -la Image_cas_5.4_with_drivers
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add Image_cas_5.4_with_drivers
            git commit -m "ci: 5.4 Image with cas drivers builtin" || true
            git push || true
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cas-image-build-log
          path: kernel54/build.log
          retention-days: 30
