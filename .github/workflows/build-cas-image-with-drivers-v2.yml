name: build-cas-image-with-drivers-v2

# =========================================================
# cas 5.4 GKI 内核 + 4 驱动内建版
# 目标：编译完整 Image，含 aw8697/bq25790/bq28z610/max77932 内建
#
# 参考：build-cas-drivers-batch.yml（已验证 4 驱动可编译为 .ko）
# 关键改动：
#   1. CONFIG_*=y（不是 =m，内建到内核）
#   2. make Image（不是 modules）
#   3. git commit + push Image 到仓库
# =========================================================

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "5.4 kernel branch"
        default: "android11-5.4"
        type: string
      push_image:
        description: "编译成功后是否 push Image 到仓库"
        default: "true"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BRANCH: "${{ github.event.inputs.kernel_branch }}"
      PUSH: "${{ github.event.inputs.push_image }}"

    steps:
      # ===== Step 1: Install deps =====
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 python3-pip xz-utils clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
            libssl-dev libelf-dev device-tree-compiler \
            python3 python3-pip xz-utils \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang-14 --version
          gcc-aarch64-linux-gnu --version

      # ===== Step 2: Clone 5.4 kernel (3 重试 + fallback) =====
      - name: Clone 5.4 kernel
        run: |
          cd $GITHUB_WORKSPACE
          for i in 1 2 3; do
            echo "=== clone attempt $i (tsinghua) ==="
            rm -rf kernel54
            git clone --depth=1 -b "$BRANCH" \
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git \
              kernel54 2>&1 | tail -5
            if [ -f kernel54/Makefile ]; then
              echo "OK: tsinghua mirror"
              break
            fi
            sleep 20
          done
          if [ ! -f kernel54/Makefile ]; then
            echo "=== fallback: aosp-mirror ==="
            git clone --depth=1 -b "$BRANCH" \
              https://github.com/aosp-mirror/kernel_common.git kernel54
          fi
          head -3 kernel54/Makefile

      # ===== Step 3: Fetch cas drivers =====
      - name: Fetch cas drivers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          API="https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents"
          for dir in \
            "drivers/input/misc/aw8697_haptic" \
            "drivers/power/supply/cas_qcom"; do
            mkdir -p "$dir"
            echo "=== fetching $dir ==="
            curl -sL --max-time 30 "$API/$dir?ref=cas-q-oss" \
              | grep '"name"' | awk -F'"' '{print $4}' | while read f; do
              curl -sL --max-time 60 -o "$dir/$f" "$BASE/$dir/$f" 2>/dev/null
            done
            ls -la "$dir"
          done

      # ===== Step 4: Fetch qcom headers =====
      - name: Fetch qcom headers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          mkdir -p include/linux drivers/power/supply
          curl -sL --max-time 60 -o include/linux/pmic-voter.h "$BASE/include/linux/pmic-voter.h" 2>/dev/null || true
          curl -sL --max-time 60 -o drivers/power/supply/pmic-voter.c "$BASE/drivers/power/supply/pmic-voter.c" 2>/dev/null || true
          ls -la include/linux/pmic-voter.h drivers/power/supply/pmic-voter.c 2>/dev/null

      # ===== Step 5: Patch power_supply.h (217 vendor enum) =====
      - name: Patch power_supply.h
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          curl -sL --max-time 60 -o /tmp/ps_cas.h \
            "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss/include/linux/power_supply.h"
          python3 << 'PYEOF'
          import re, sys
          cas = open('/tmp/ps_cas.h').read()
          c54 = open('include/linux/power_supply.h').read()
          c54 = re.sub(r'\n*/\* cas 4\.19 vendor extensions \*/.*?\n\};\n?', '\n', c54, flags=re.DOTALL)
          pat = r'POWER_SUPPLY_[A-Z_0-9]+'
          cas_all = set(re.findall(pat, cas))
          c54_all = set(re.findall(pat, c54))
          diff = sorted(cas_all - c54_all)
          print(f"cas enum: {len(cas_all)}")
          print(f"5.4 enum: {len(c54_all)}")
          print(f"diff to add: {len(diff)}")
          last_endif = c54.rfind('#endif')
          if last_endif < 0:
              print("ERROR: no #endif"); sys.exit(1)
          ins = '\n/* cas 4.19 vendor extensions */\nenum cas_vendor_power_supply_ext {\n'
          for d in diff:
              ins += '\t%s,\n' % d
          ins += '};\n\n'
          new = c54[:last_endif] + ins + c54[last_endif:]
          open('include/linux/power_supply.h', 'w').write(new)
          print(f"Inserted {len(diff)} vendor enum values before #endif")
          PYEOF
          echo "=== verify ==="
          tail -8 include/linux/power_supply.h
          grep -c "cas 4.19 vendor extensions" include/linux/power_supply.h

      # ===== Step 6: Patch for 5.4 (uaccess + do_gettimeofday) =====
      - name: Patch for 5.4
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          find drivers/input/misc/aw8697_haptic drivers/power/supply/cas_qcom \
               -type f \( -name "*.c" -o -name "*.h" \) 2>/dev/null | while read f; do
            grep -q "asm/uaccess.h" "$f" 2>/dev/null \
              && sed -i 's|<asm/uaccess.h>|<linux/uaccess.h>|g' "$f"
            if grep -q "do_gettimeofday" "$f" 2>/dev/null \
               && ! grep -q "cas_compat_do_gettimeofday" "$f"; then
              LAST=$(grep -n '^#include' "$f" | tail -1 | cut -d: -f1)
              head -${LAST} "$f" > /tmp/p.c
              echo '/* ==== cas_compat_do_gettimeofday: 5.4 compat ==== */' >> /tmp/p.c
              echo '#include <linux/timekeeping.h>' >> /tmp/p.c
              echo '#ifndef do_gettimeofday' >> /tmp/p.c
              echo '#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)' >> /tmp/p.c
              echo '#endif' >> /tmp/p.c
              tail -n +$((${LAST}+1)) "$f" >> /tmp/p.c
              mv /tmp/p.c "$f"
              echo "patched: $f"
            fi
          done

      # ===== Step 7: Hook Kconfig/Makefile =====
      - name: Hook Kconfig/Makefile
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          grep -q "aw8697_haptic" drivers/input/misc/Kconfig \
            || echo 'source "drivers/input/misc/aw8697_haptic/Kconfig"' >> drivers/input/misc/Kconfig
          grep -q "aw8697_haptic" drivers/input/misc/Makefile \
            || echo 'obj-$(CONFIG_INPUT_AW8697_HAPTIC) += aw8697_haptic/' >> drivers/input/misc/Makefile
          if [ -f drivers/power/supply/cas_qcom/Kconfig ]; then
            grep -q "cas_qcom" drivers/power/supply/Kconfig \
              || echo 'source "drivers/power/supply/cas_qcom/Kconfig"' >> drivers/power/supply/Kconfig
            grep -q "cas_qcom" drivers/power/supply/Makefile \
              || echo 'obj-y += cas_qcom/' >> drivers/power/supply/Makefile
          fi
          if [ -f drivers/power/supply/pmic-voter.c ]; then
            grep -q "pmic-voter" drivers/power/supply/Makefile \
              || echo 'obj-y += pmic-voter.o' >> drivers/power/supply/Makefile
          fi
          echo "--- drivers/input/misc/Kconfig tail ---"
          tail -3 drivers/input/misc/Kconfig
          echo "--- drivers/input/misc/Makefile tail ---"
          tail -3 drivers/input/misc/Makefile
          echo "--- drivers/power/supply/Kconfig tail ---"
          tail -5 drivers/power/supply/Kconfig
          echo "--- drivers/power/supply/Makefile tail ---"
          tail -5 drivers/power/supply/Makefile

      # ===== Step 8: Enable configs (=y 内建) =====
      - name: Enable configs (=y)
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          {
            echo 'CONFIG_INPUT_AW8697_HAPTIC=y'
            echo 'CONFIG_QPNP_SMB5_CAS=y'
            echo 'CONFIG_CHARGER_BQ25790=y'
            echo 'CONFIG_FUEL_GAUGE_BQ28Z610=y'
            echo 'CONFIG_CP_MAX77932=y'
          } >> arch/arm64/configs/gki_defconfig
          echo "--- gki_defconfig tail ---"
          tail -10 arch/arm64/configs/gki_defconfig
          make ARCH=arm64 gki_defconfig > /dev/null 2>&1
          echo "--- 5 CONFIG status ---"
          grep -E "^(CONFIG_INPUT_AW8697_HAPTIC|CONFIG_QPNP_SMB5_CAS|CONFIG_CHARGER_BQ25790|CONFIG_FUEL_GAUGE_BQ28Z610|CONFIG_CP_MAX77932)" .config

      # ===== Step 9: Build Image =====
      - name: Build Image
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) Image > build.log 2>&1
          RC=$?
          echo "build rc=$RC"
          echo "--- build.log tail ---"
          tail -50 build.log
          echo "--- Image check ---"
          ls -la arch/arm64/boot/Image 2>&1
          if [ ! -f arch/arm64/boot/Image ]; then
            echo "!!! Image NOT built"
            grep -iE "error:|fatal error" build.log | head -30
            exit 1
          fi
          echo "=== Image built successfully ==="

      # ===== Step 10: Package + Commit + Push =====
      - name: Package + Commit + Push
        if: always()
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          mkdir -p $GITHUB_WORKSPACE/artifacts
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image $GITHUB_WORKSPACE/artifacts/Image_cas_5.4_with_drivers
            cp arch/arm64/boot/Image $GITHUB_WORKSPACE/Image_cas_5.4_with_drivers
            ls -la $GITHUB_WORKSPACE/Image_cas_5.4_with_drivers
          fi
          [ -f build.log ] && cp build.log $GITHUB_WORKSPACE/artifacts/build.log
          ls -la $GITHUB_WORKSPACE/artifacts/
          if [ -f $GITHUB_WORKSPACE/Image_cas_5.4_with_drivers ] && [ "$PUSH" = "true" ]; then
            cd $GITHUB_WORKSPACE
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
            git add Image_cas_5.4_with_drivers
            git add artifacts/ 2>/dev/null || true
            git commit -m "build: cas 5.4 Image with 4 drivers (aw8697+bq25790+bq28z610+max77932) [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git push origin HEAD:${BRANCH} 2>&1 | tail -10
            echo "--- push rc=$? ---"
          else
            echo "Skip commit/push (no Image or PUSH=$PUSH)"
          fi

      # ===== Step 11: Summary =====
      - name: Summary
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/kernel54 2>/dev/null || true
          {
            echo "## cas 5.4 Image build report"
            echo ""
            echo "### Image"
            echo "\`\`\`"
            ls -la $GITHUB_WORKSPACE/Image_cas_5.4_with_drivers 2>/dev/null || echo "no image"
            echo "\`\`\`"
            echo ""
            echo "### CONFIG status"
            echo "\`\`\`"
            grep -E "^(CONFIG_INPUT_AW8697_HAPTIC|CONFIG_QPNP_SMB5_CAS|CONFIG_CHARGER_BQ25790|CONFIG_FUEL_GAUGE_BQ28Z610|CONFIG_CP_MAX77932)" .config 2>/dev/null
            echo "\`\`\`"
            echo ""
            echo "### build.log errors"
            echo "\`\`\`"
            grep -iE "error:|fatal error" build.log 2>/dev/null | head -20
            echo "\`\`\`"
            echo ""
            echo "### build.log tail"
            echo "\`\`\`"
            tail -30 build.log 2>/dev/null
            echo "\`\`\`"
          } >> $GITHUB_STEP_SUMMARY
