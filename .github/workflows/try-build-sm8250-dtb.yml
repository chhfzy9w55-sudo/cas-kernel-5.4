name: try-build-sm8250-dtb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev device-tree-compiler \
            python3 python3-pip xz-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone linux 510
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 --filter=blob:none --sparse \
            -b v5.10 https://github.com/torvalds/linux.git linux510
          cd linux510
          git sparse-checkout set include/dt-bindings arch/arm64/boot/dts/qcom

      - name: Clone 54 kernel full
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b android11-5.4 \
            https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git \
            kernel54
          cd kernel54
          echo "=== HEAD ==="
          git rev-parse HEAD
          du -sh .

      - name: Merge dt bindings force
        run: |
          cd $GITHUB_WORKSPACE/kernel54/include/dt-bindings
          for f in clock/qcom,gcc-sm8250.h clock/qcom,gpucc-sm8250.h \
                   clock/qcom,rpmh.h interconnect/qcom,osm-l3.h \
                   mailbox/qcom-ipcc.h power/qcom-aoss-qmp.h \
                   power/qcom-rpmpd.h regulator/qcom,rpmh-regulator.h \
                   soc/qcom,rpmh-rsc.h; do
            src=$GITHUB_WORKSPACE/linux510/include/dt-bindings/$f
            if [ -f "$src" ]; then
              mkdir -p $(dirname "$f")
              cp -f "$src" "$f"
              echo "复制 $f"
            else
              echo "5.10 缺 $f"
            fi
          done
          echo ""
          echo "=== 验证 qcom-rpmpd.h 里有 SM8250_CX ==="
          grep -n "SM8250_CX" power/qcom-rpmpd.h || echo "未找到 SM8250_CX"

      - name: Copy sm8250 dtsi
        run: |
          cd $GITHUB_WORKSPACE/linux510/arch/arm64/boot/dts/qcom
          cp -v sm8250.dtsi sm8250-mtp.dts pm8009.dtsi pm8150.dtsi pm8150b.dtsi pm8150l.dtsi \
            $GITHUB_WORKSPACE/kernel54/arch/arm64/boot/dts/qcom/
          echo ""
          echo "=== 拷入后 sm8250.dtsi 前 5 行 ==="
          head -5 $GITHUB_WORKSPACE/kernel54/arch/arm64/boot/dts/qcom/sm8250.dtsi
          echo ""
          echo "=== 485 行内容 ==="
          sed -n '485p' $GITHUB_WORKSPACE/kernel54/arch/arm64/boot/dts/qcom/sm8250.dtsi

      - name: Add to Makefile
        run: |
          cd $GITHUB_WORKSPACE/kernel54/arch/arm64/boot/dts/qcom
          if ! grep -q "sm8250-mtp.dtb" Makefile; then
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8250-mtp.dtb' >> Makefile
          fi

      - name: Try build dtbs
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          echo "===== gki_defconfig ====="
          make ARCH=arm64 gki_defconfig > gkidef.log 2>&1
          GK=$?
          echo "exit=$GK"
          echo ""
          echo "===== dtbs ====="
          make ARCH=arm64 dtbs > build.log 2>&1
          RESULT=$?
          echo "exit=$RESULT"
          
          ERRORS=$(grep -iE "error|fatal|No such|not found|undefined" build.log | head -20)
          DTBS=$(find arch/arm64/boot/dts/qcom -name "sm8250*.dtb" 2>/dev/null)
          
          if [ $GK -ne 0 ]; then
            GK_ERR=$(tail -5 gkidef.log | tr '\n' '|')
            echo "::error title=gki_defconfig 失败::${GK_ERR}"
          fi
          
          if [ $RESULT -ne 0 ]; then
            ERR_LINE=$(echo "$ERRORS" | head -3 | tr '\n' '|')
            echo "::error title=dtbs 编译失败 exit=$RESULT::前3个错误: ${ERR_LINE}"
          else
            DTB_LINE=$(echo "$DTBS" | tr '\n' ' ')
            echo "::notice title=dtbs 编译成功::产物: ${DTB_LINE}"
          fi
          
          {
            echo "## dtbs 编译结果"
            echo ""
            echo "### gki_defconfig exit=$GK"
            echo ""
            echo "### dtbs exit=$RESULT"
            echo ""
            echo "### 错误摘要"
            echo '```'
            echo "$ERRORS"
            echo '```'
            echo ""
            echo "### sm8250 dtsi 485 行"
            echo '```'
            sed -n '485p' arch/arm64/boot/dts/qcom/sm8250.dtsi
            echo '```'
            echo ""
            echo "### LAST 40 LINES"
            echo '```'
            tail -40 build.log
            echo '```'
            echo ""
            echo "### sm8250 产物"
            echo '```'
            echo "$DTBS"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          
          exit 0

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-build-log
          path: |
            kernel54/build.log
            kernel54/gkidef.log
          retention-days: 30
