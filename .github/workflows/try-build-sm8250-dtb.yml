name: try-build-sm8250-dtb

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev device-tree-compiler \
            python3 python3-pip xz-utils \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone linux 510
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 --filter=blob:none --sparse \
            -b v5.10 https://github.com/torvalds/linux.git linux510
          cd linux510
          git sparse-checkout set include/dt-bindings arch/arm64/boot/dts/qcom

      - name: Clone 54 kernel
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 --filter=blob:none --sparse \
            -b android11-5.4 \
            https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git \
            kernel54
          cd kernel54
          git sparse-checkout set arch/arm64/boot/dts arch/arm64/configs include/dt-bindings scripts
          echo "=== scripts 目录 ==="
          ls scripts/ | head -10
          echo "=== Makefile.ubsan 存在？ ==="
          ls scripts/Makefile.ubsan

      - name: Merge dt bindings
        run: |
          cd $GITHUB_WORKSPACE/kernel54/include/dt-bindings
          for f in clock/qcom,gcc-sm8250.h clock/qcom,gpucc-sm8250.h \
                   clock/qcom,rpmh.h interconnect/qcom,osm-l3.h \
                   mailbox/qcom-ipcc.h power/qcom-aoss-qmp.h \
                   power/qcom-rpmpd.h regulator/qcom,rpmh-regulator.h \
                   soc/qcom,rpmh-rsc.h; do
            src=$GITHUB_WORKSPACE/linux510/include/dt-bindings/$f
            if [ -f "$src" ] && [ ! -f "$f" ]; then
              mkdir -p $(dirname "$f")
              cp "$src" "$f"
              echo "补充 $f"
            elif [ -f "$f" ]; then
              echo "已存在 $f"
            else
              echo "5.10 也缺 $f"
            fi
          done

      - name: Copy sm8250 dtsi
        run: |
          cd $GITHUB_WORKSPACE/linux510/arch/arm64/boot/dts/qcom
          cp -v sm8250.dtsi sm8250-mtp.dts pm8009.dtsi pm8150.dtsi pm8150b.dtsi pm8150l.dtsi \
            $GITHUB_WORKSPACE/kernel54/arch/arm64/boot/dts/qcom/

      - name: Add to Makefile
        run: |
          cd $GITHUB_WORKSPACE/kernel54/arch/arm64/boot/dts/qcom
          if ! grep -q "sm8250-mtp.dtb" Makefile; then
            echo 'dtb-$(CONFIG_ARCH_QCOM) += sm8250-mtp.dtb' >> Makefile
          fi
          tail -3 Makefile

      - name: Try build dtbs
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          set +e
          echo "===== gki_defconfig ====="
          make ARCH=arm64 gki_defconfig 2>&1 | tail -10
          echo ""
          echo "===== dtbs ====="
          make ARCH=arm64 dtbs > build.log 2>&1
          RESULT=$?
          echo "exit=$RESULT"
          echo ""
          echo "===== ERROR SUMMARY ====="
          grep -iE "error|fatal|No such|undefined|not found" build.log | head -40 || true
          echo ""
          echo "===== LAST 60 LINES ====="
          tail -60 build.log
          echo ""
          echo "===== 产物 ====="
          find arch/arm64/boot/dts/qcom -name "*.dtb" 2>/dev/null | head -10
          exit 0

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtbs-build-log
          path: kernel54/build.log
          retention-days: 30
