name: build-cas-drivers-batch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev device-tree-compiler \
            python3 python3-pip xz-utils \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone 5.4 kernel with retry
        run: |
          cd $GITHUB_WORKSPACE
          for i in 1 2 3; do
            echo "=== 尝试 $i/3 ==="
            rm -rf kernel54
            if git clone --depth=1 -b android11-5.4 \
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git \
              kernel54 2>&1 | tail -5; then
              if [ -d kernel54/.git ]; then
                echo "克隆成功"
                break
              fi
            fi
            sleep 30
          done
          if [ ! -d kernel54/.git ]; then
            git clone --depth=1 -b android11-5.4 \
              https://github.com/aosp-mirror/kernel_common.git \
              kernel54
          fi

      - name: Fetch cas drivers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          
          for dir in \
            "drivers/input/misc/aw8697_haptic" \
            "drivers/power/supply/cas_qcom" \
            "drivers/input/touchscreen/fts_521" \
            "drivers/soc/qcom/icnss2"; do
            echo "=== $dir ==="
            mkdir -p "$dir"
            API_URL="https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents/$dir?ref=cas-q-oss"
            curl -sL "$API_URL" | grep '"name"' | awk -F'"' '{print $4}' | while read f; do
              curl -sL --max-time 60 -o "$dir/$f" "$BASE/$dir/$f" 2>/dev/null
            done
            ls "$dir/" | head -10
          done

      - name: Report fetched drivers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          for d in drivers/input/misc/aw8697_haptic \
                   drivers/power/supply/cas_qcom \
                   drivers/input/touchscreen/fts_521 \
                   drivers/soc/qcom/icnss2; do
            if [ -d "$d" ]; then
              echo "$d: $(ls $d | wc -l) files, $(du -sh $d | awk '{print $1}')"
            fi
          done

      - name: Patch for 5.4
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          
          find drivers/input/misc/aw8697_haptic \
               drivers/input/touchscreen \
               drivers/power/supply \
               drivers/soc/qcom \
               -name "*.c" -o -name "*.h" 2>/dev/null | while read f; do
            if grep -q "do_gettimeofday\|asm/uaccess.h" "$f" 2>/dev/null; then
              echo "patch: $f"
              sed -i 's|<asm/uaccess.h>|<linux/uaccess.h>|g' "$f"
              
              if grep -q "do_gettimeofday" "$f"; then
                LAST=$(grep -n "^#include" "$f" | tail -1 | cut -d: -f1)
                head -${LAST} "$f" > /tmp/patched.c
                echo '#include <linux/timekeeping.h>' >> /tmp/patched.c
                echo '#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)' >> /tmp/patched.c
                tail -n +$((${LAST}+1)) "$f" >> /tmp/patched.c
                mv /tmp/patched.c "$f"
              fi
            fi
          done

      - name: Hook Kconfig Makefile
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          
          echo "=== aw8697 ==="
          if [ -f drivers/input/misc/aw8697_haptic/Kconfig ]; then
            echo 'source "drivers/input/misc/aw8697_haptic/Kconfig"' >> drivers/input/misc/Kconfig
            echo 'obj-$(CONFIG_INPUT_AW8697_HAPTIC) += aw8697_haptic/' >> drivers/input/misc/Makefile
            echo "hooked"
          fi
          
          echo "=== cas_qcom ==="
          if [ -f drivers/power/supply/cas_qcom/Kconfig ]; then
            echo 'source "drivers/power/supply/cas_qcom/Kconfig"' >> drivers/power/supply/Kconfig
            echo 'obj-y += cas_qcom/' >> drivers/power/supply/Makefile
            echo "hooked"
          else
            echo "cas_qcom Kconfig missing"
            ls drivers/power/supply/ | head -20
          fi
          
          echo "=== fts_521 ==="
          if [ -f drivers/input/touchscreen/fts_521/Kconfig ]; then
            echo 'source "drivers/input/touchscreen/fts_521/Kconfig"' >> drivers/input/touchscreen/Kconfig
            echo 'obj-$(CONFIG_TOUCHSCREEN_FTS) += fts_521/' >> drivers/input/touchscreen/Makefile
            echo "hooked"
          fi
          
          echo "=== 验证 ==="
          tail -2 drivers/input/misc/Kconfig
          tail -2 drivers/power/supply/Kconfig
          tail -2 drivers/input/touchscreen/Kconfig

      - name: Enable key configs
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          {
            echo 'CONFIG_INPUT_AW8697_HAPTIC=m'
            echo 'CONFIG_QPNP_SMB5_CAS=m'
            echo 'CONFIG_CHARGER_BQ25790=m'
            echo 'CONFIG_FUEL_GAUGE_BQ28Z610=m'
            echo 'CONFIG_CP_MAX77932=m'
          } >> arch/arm64/configs/gki_defconfig
          make ARCH=arm64 gki_defconfig > /dev/null 2>&1
          grep -E "AW8697|SMB5_CAS|BQ25790|BQ28Z610|MAX77932" .config || echo "无匹配配置"

      - name: Prepare kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            prepare modules_prepare > prep.log 2>&1
          echo "prep exit=$?"

      - name: Build aw8697
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/input/misc/aw8697_haptic modules > aw.log 2>&1
          echo "aw8697 exit=$?"
          tail -20 aw.log

      - name: Build cas_qcom
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/power/supply/cas_qcom modules > cq.log 2>&1
          echo "cas_qcom exit=$?"
          tail -40 cq.log

      - name: Summary
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          {
            echo "## cas 驱动批量编译"
            echo ""
            echo "### 产物 .ko"
            echo '```'
            find drivers -name "*.ko" 2>/dev/null
            echo '```'
            echo ""
            echo "### aw8697 尾部"
            echo '```'
            tail -20 aw.log 2>/dev/null || echo "无 log"
            echo '```'
            echo ""
            echo "### cas_qcom 错误"
            echo '```'
            grep -iE "error:|fatal error" cq.log 2>/dev/null | head -30 || echo "无错误"
            echo '```'
            echo ""
            echo "### cas_qcom 尾部"
            echo '```'
            tail -40 cq.log 2>/dev/null || echo "无 log"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cas-drivers-logs
          path: |
            kernel54/aw.log
            kernel54/cq.log
            kernel54/prep.log
          retention-days: 30
