name: build-cas-drivers-batch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex \
            libssl-dev libelf-dev device-tree-compiler \
            python3 python3-pip xz-utils \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Clone 5.4 kernel with retry
        run: |
          cd $GITHUB_WORKSPACE
          for i in 1 2 3; do
            rm -rf kernel54
            if git clone --depth=1 -b android11-5.4 \
              https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git \
              kernel54 2>&1 | tail -3; then
              [ -d kernel54/.git ] && break
            fi
            sleep 30
          done
          if [ ! -d kernel54/.git ]; then
            git clone --depth=1 -b android11-5.4 \
              https://github.com/aosp-mirror/kernel_common.git kernel54
          fi

      - name: Fetch cas drivers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          for dir in \
            "drivers/input/misc/aw8697_haptic" \
            "drivers/power/supply/cas_qcom"; do
            mkdir -p "$dir"
            API_URL="https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents/$dir?ref=cas-q-oss"
            curl -sL "$API_URL" | grep '"name"' | awk -F'"' '{print $4}' | while read f; do
              curl -sL --max-time 60 -o "$dir/$f" "$BASE/$dir/$f" 2>/dev/null
            done
          done

      - name: Fetch qcom headers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          mkdir -p include/linux
          curl -sL --max-time 60 -o include/linux/pmic-voter.h "$BASE/include/linux/pmic-voter.h" 2>/dev/null || true
          curl -sL --max-time 60 -o drivers/power/supply/pmic-voter.c "$BASE/drivers/power/supply/pmic-voter.c" 2>/dev/null || true

      - name: Patch power_supply.h ALL
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          
          curl -sL --max-time 60 -o /tmp/ps_cas.h \
            "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss/include/linux/power_supply.h"
          
          python3 << 'PYEOF'
          import re
          
          with open('/tmp/ps_cas.h') as f:
              cas = f.read()
          with open('include/linux/power_supply.h') as f:
              c54 = f.read()
          
          # 提取所有 POWER_SUPPLY_ 常量
          pat = r'POWER_SUPPLY_[A-Z_0-9]+'
          cas_all = set(re.findall(pat, cas))
          c54_all = set(re.findall(pat, c54))
          diff = sorted(cas_all - c54_all)
          
          print(f"总差集: {len(diff)}")
          for d in diff[:10]:
              print(f"  {d}")
          print("  ...")
          
          # 追加到文件末尾的一个新 enum
          # 检查文件末尾是否已有我们的标记
          marker = '/* cas 4.19 vendor extensions */'
          if marker in c54:
              print("已存在标记，跳过")
          else:
              insertion = '\n\n/* cas 4.19 vendor extensions */\n'
              insertion += 'enum cas_vendor_power_supply_ext {\n'
              for d in diff:
                  insertion += f'\t{d},\n'
              insertion += '};\n'
              c54 = c54.rstrip() + insertion
              with open('include/linux/power_supply.h', 'w') as f:
                  f.write(c54)
              print(f"已追加 {len(diff)} 个属性到新 enum")
          PYEOF
          
          echo "=== 验证 ==="
          tail -20 include/linux/power_supply.h
          grep -c "POWER_SUPPLY_" include/linux/power_supply.h

      - name: Patch for 5.4
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          find drivers/input/misc/aw8697_haptic drivers/power/supply \
               -name "*.c" -o -name "*.h" 2>/dev/null | while read f; do
            grep -q "asm/uaccess.h" "$f" 2>/dev/null && sed -i 's|<asm/uaccess.h>|<linux/uaccess.h>|g' "$f"
            if grep -q "do_gettimeofday" "$f" 2>/dev/null; then
              LAST=$(grep -n "^#include" "$f" | tail -1 | cut -d: -f1)
              head -${LAST} "$f" > /tmp/p.c
              echo '#include <linux/timekeeping.h>' >> /tmp/p.c
              echo '#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)' >> /tmp/p.c
              tail -n +$((${LAST}+1)) "$f" >> /tmp/p.c
              mv /tmp/p.c "$f"
            fi
          done

      - name: Hook Kconfig Makefile
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          echo 'source "drivers/input/misc/aw8697_haptic/Kconfig"' >> drivers/input/misc/Kconfig
          echo 'obj-$(CONFIG_INPUT_AW8697_HAPTIC) += aw8697_haptic/' >> drivers/input/misc/Makefile
          if [ -f drivers/power/supply/cas_qcom/Kconfig ]; then
            echo 'source "drivers/power/supply/cas_qcom/Kconfig"' >> drivers/power/supply/Kconfig
            echo 'obj-y += cas_qcom/' >> drivers/power/supply/Makefile
          fi
          [ -f drivers/power/supply/pmic-voter.c ] && echo 'obj-y += pmic-voter.o' >> drivers/power/supply/Makefile

      - name: Enable configs
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          {
            echo 'CONFIG_INPUT_AW8697_HAPTIC=m'
            echo 'CONFIG_QPNP_SMB5_CAS=m'
            echo 'CONFIG_CHARGER_BQ25790=m'
            echo 'CONFIG_FUEL_GAUGE_BQ28Z610=m'
            echo 'CONFIG_CP_MAX77932=m'
          } >> arch/arm64/configs/gki_defconfig
          make ARCH=arm64 gki_defconfig > /dev/null 2>&1

      - name: Prepare kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 \
            CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            prepare modules_prepare > prep.log 2>&1

      - name: Build aw8697
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/input/misc/aw8697_haptic modules > aw.log 2>&1

      - name: Build cas_qcom
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            M=drivers/power/supply/cas_qcom modules > cq.log 2>&1

      - name: Summary
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          {
            echo "## cas 驱动批量编译（全枚举 patch）"
            echo ""
            echo "### .ko 产物"
            echo '```'
            find drivers -name "*.ko" 2>/dev/null
            echo '```'
            echo ""
            echo "### power_supply.h 追加数量"
            echo '```'
            tail -5 include/linux/power_supply.h
            echo '```'
            echo ""
            echo "### cq 错误"
            echo '```'
            grep -iE "error:|fatal error" cq.log 2>/dev/null | head -20
            echo '```'
            echo ""
            echo "### cq 尾部"
            echo '```'
            tail -30 cq.log 2>/dev/null
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
