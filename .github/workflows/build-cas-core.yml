name: build-cas-core
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 python3-pip xz-utils curl ca-certificates clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu
      - name: Clone Linux 5.4 kernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 -b 5.4 https://github.com/rofikkerneldev/qgki_kona_5.4.git "$GITHUB_WORKSPACE/kernel54"
      - name: Fetch and validate 4.19 sources
        shell: bash
        env:
          SOURCE_REPO: MiCode/Xiaomi_Kernel_OpenSource
          SOURCE_REF: cas-q-oss
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel54"
          python3 <<'PY'
          import json, os, pathlib, urllib.request, urllib.parse
          repo = os.environ["SOURCE_REPO"]
          ref = os.environ["SOURCE_REF"]
          sources = {
              "drivers/input/misc/aw8697_haptic": pathlib.Path("port_cas/aw8697_haptic"),
              "drivers/power/supply/cas_qcom": pathlib.Path("port_cas/cas_qcom"),
          }
          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "ci"})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def download_tree(remote_dir, local_dir):
              api_url = f"https://api.github.com/repos/{repo}/contents/{urllib.parse.quote(remote_dir, safe='/')}?ref={urllib.parse.quote(ref)}"
              entries = get_json(api_url)
              local_dir.mkdir(parents=True, exist_ok=True)
              for entry in entries:
                  name = entry.get("name", "")
                  kind = entry.get("type")
                  if kind == "dir":
                      download_tree(f"{remote_dir}/{name}", local_dir / name)
                      continue
                  if kind != "file": continue
                  url = entry.get("download_url")
                  target = local_dir / name
                  req = urllib.request.Request(url, headers={"User-Agent": "ci"})
                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = response.read()
                  target.write_bytes(data)
          for remote, local in sources.items():
              download_tree(remote, local)
          required = [pathlib.Path("port_cas/aw8697_haptic/aw8697.c"), pathlib.Path("port_cas/cas_qcom/battery.c"), pathlib.Path("port_cas/cas_qcom/bq27z561_fg.c")]
          for path in required:
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"ERROR: Missing {path}")
          PY
      - name: Apply patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel54"
          curl -sL -o /tmp/ps_4_19.h "https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss/include/linux/power_supply.h"
          python3 <<'PY'
          import re
          from pathlib import Path
          target_h = Path("include/linux/power_supply.h")
          content = target_h.read_text()
          cas = Path('/tmp/ps_4_19.h').read_text()
          all_symbols = set(re.findall(r'\b(POWER_SUPPLY_[A-Z0-9_]+)\b', cas))
          missing = [s for s in all_symbols if s not in content]
          if missing:
              insertion = "\n\n/* Injected */\n"
              for i, m in enumerate(missing):
                  insertion += f"#ifndef {m}\n#define {m} (0x8000 + {i})\n#endif\n"
              last_endif = content.rfind('#endif')
              target_h.write_text(content[:last_endif] + insertion + content[last_endif:])
          for path in Path("port_cas").rglob("*.c"):
              text = path.read_text()
              text = text.replace('wakeup_source_register("', 'wakeup_source_register(NULL, "')
              text = text.replace("asm/uaccess.h", "linux/uaccess.h")
              if "do_gettimeofday" in text and "ktime_get_real_ts64" not in text:
                  text = "#include <linux/time64.h>\n#include <linux/ktime.h>\n#include <linux/timekeeping.h>\n#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)\n" + text
              path.write_text(text)
          PY
      - name: Configure Makefiles
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel54"
          grep -q 'port_cas' drivers/Makefile || echo 'obj-y += port_cas/' >> drivers/Makefile
          printf 'obj-y += aw8697_haptic/\nobj-y += cas_qcom/\n' > port_cas/Makefile
          printf 'obj-y += aw8697.o\n' > port_cas/aw8697_haptic/Makefile
          printf 'obj-y += battery.o\nobj-y += bq27z561_fg.o\n' > port_cas/cas_qcom/Makefile
      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel54"
          if [ -f arch/arm64/configs/vendor/kona-perf_defconfig ]; then
            make ARCH=arm64 vendor/kona-perf_defconfig
          else
            make ARCH=arm64 gki_defconfig
          fi
          bash scripts/config --enable I2C
          bash scripts/config --enable POWER_SUPPLY
          bash scripts/config --enable INPUT
          bash scripts/config --enable INPUT_MISC
          bash scripts/config --enable SCSI
          bash scripts/config --enable SCSI_UFSHCD
          make ARCH=arm64 olddefconfig
          make ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- -j2 Image 2>&1 | tee build.log
      - name: Show errors
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel54"
          if [ -f build.log ]; then
            grep -niE 'error:|fatal error:|undefined reference|undefined symbol|No rule|ld\.lld:|clang: error:' build.log | tail -50
          fi
      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image_cas_core
          path: kernel54/arch/arm64/boot/Image
