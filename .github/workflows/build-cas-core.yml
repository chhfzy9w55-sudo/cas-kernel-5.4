name: build-cas-core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 python3-pip xz-utils
          sudo apt-get install -y clang-14 lld-14 llvm-14
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Clone 5.4 kernel
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b 5.4 https://github.com/rofikkerneldev/qgki_kona_5.4.git kernel54

      - name: Fetch headers and Suture
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          curl -sL --max-time 60 -o /tmp/ps_4_19.h "$BASE/include/linux/power_supply.h"
          curl -sL -o include/linux/power_supply.h "https://raw.githubusercontent.com/torvalds/linux/v5.10/include/linux/power_supply.h"
          
          python3 << 'PYEOF'
          import re
          with open('/tmp/ps_4_19.h') as f: cas = f.read()
          with open('include/linux/power_supply.h') as f: current = f.read()
          all_symbols = set(re.findall(r'\b(POWER_SUPPLY_[A-Z0-9_]+)\b', cas))
          missing = [s for s in all_symbols if s not in current]
          if missing:
              insertion = "\n\n/* Injected from 4.19 for cas_qcom compatibility */\n"
              for i, m in enumerate(missing):
                  insertion += f"#ifndef {m}\n#define {m} (0x8000 + {i})\n#endif\n"
              last_endif = current.rfind('#endif')
              new_content = current[:last_endif] + insertion + current[last_endif:]
              with open('include/linux/power_supply.h', 'w') as f: f.write(new_content)
          PYEOF

      - name: Fetch 4.19 peripherals
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          for dir in "drivers/input/misc/aw8697_haptic:aw8697_haptic" "drivers/power/supply/cas_qcom:cas_qcom"; do
            SRC=$(echo $dir | cut -d: -f1)
            DEST="port_cas/$(echo $dir | cut -d: -f2)"
            mkdir -p "$DEST"
            API_URL="https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents/$SRC?ref=cas-q-oss"
            curl -sL "$API_URL" | grep '"name"' | awk -F'"' '{print $4}' | while read f; do
              curl -sL --max-time 60 -o "$DEST/$f" "$BASE/$SRC/$f" 2>/dev/null
            done
          done

      - name: Patch 4.19 peripherals
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          find port_cas -name "*.c" -exec sed -i 's/wakeup_source_register("/wakeup_source_register(NULL, "/g' {} \;
          find port_cas -name "*.c" -exec sed -i 's|asm/uaccess.h|linux/uaccess.h|g' {} \;
          for file in $(find port_cas -name "*.c"); do
            if grep -q "do_gettimeofday" "$file"; then
              sed -i '1i #include <linux/time64.h>\n#include <linux/ktime.h>\n#include <linux/timekeeping.h>\n#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)' "$file"
            fi
          done

      - name: HARDCODE Makefiles
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          if ! grep -q "port_cas" drivers/Makefile; then
            echo 'obj-y += port_cas/' >> drivers/Makefile
          fi
          
          echo 'obj-y += aw8697_haptic/' > port_cas/Makefile
          echo 'obj-y += cas_qcom/' >> port_cas/Makefile
          echo 'obj-y += aw8697.o' > port_cas/aw8697_haptic/Makefile
          
          cd port_cas/cas_qcom
          rm -f Makefile
          # 断臂求生：只编译 battery.o 和 bq27z561_fg.o，彻底剔除无线充和快充
          echo "obj-y += battery.o" > Makefile
          echo "obj-y += bq27z561_fg.o" >> Makefile
          cd $GITHUB_WORKSPACE/kernel54

      - name: Config and Build
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          if [ -f arch/arm64/configs/vendor/kona-perf_defconfig ]; then
              make ARCH=arm64 vendor/kona-perf_defconfig
          elif [ -f arch/arm64/configs/gki_defconfig ]; then
              make ARCH=arm64 gki_defconfig
          fi
          
          echo 'CONFIG_I2C=y' >> .config
          echo 'CONFIG_POWER_SUPPLY=y' >> .config
          echo 'CONFIG_INPUT=y' >> .config
          echo 'CONFIG_INPUT_MISC=y' >> .config
          echo 'CONFIG_SCSI=y' >> .config
          echo 'CONFIG_SCSI_UFSHCD=y' >> .config
          echo '# CONFIG_HID_PLAYSTATION is not set' >> .config
          make ARCH=arm64 olddefconfig
          
          set +e
          set -o pipefail
          make ARCH=arm64 \
            CC=clang-14 \
            LD=ld.lld-14 \
            AR=llvm-ar-14 \
            NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 \
            OBJDUMP=llvm-objdump-14 \
            STRIP=llvm-strip-14 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 Image > build.log 2>&1

          build_status=$?
          if [ "$build_status" -ne 0 ]; then
              echo "=== Build failed: exit code $build_status ==="
              tail -n 120 build.log
              grep -in -B 2 -A 4 -E 'error:|fatal error:|No rule to make target|Killed|signal 9|out of memory|Error 1' build.log | head -n 120 || true
              exit "$build_status"
          fi
          test -s arch/arm64/boot/Image || exit 1

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image_cas_core
          path: kernel54/arch/arm64/boot/Image
          retention-days: 30
