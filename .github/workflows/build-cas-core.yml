name: build-cas-core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 python3-pip xz-utils
          sudo apt-get install -y clang-14 lld-14 llvm-14
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Clone 5.4 kernel
        uses: actions/checkout@v4
        with:
          repository: aosp-mirror/kernel_common
          ref: android11-5.4
          path: kernel54
          fetch-depth: 1
      - name: Verify 5.4 kernel
        run: |
          test -d $GITHUB_WORKSPACE/kernel54 || (echo "::error::Failed to clone 5.4 kernel" && exit 1)
          ls $GITHUB_WORKSPACE/kernel54/Makefile >/dev/null || (echo "::error::kernel54/Makefile missing" && exit 1)

      - name: Clone 5.10 kernel
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 --filter=blob:none --sparse -b v5.10 https://github.com/torvalds/linux.git linux510
          cd linux510
          git sparse-checkout set drivers/scsi/ufs drivers/clk/qcom drivers/interconnect/qcom include/dt-bindings include/linux/power_supply.h

      - name: Overlay 5.10 core into 5.4
        run: |
          cd $GITHUB_WORKSPACE
          cp -rvf linux510/drivers/scsi/ufs/* kernel54/drivers/scsi/ufs/
          cp -rvf linux510/drivers/clk/qcom/* kernel54/drivers/clk/qcom/
          cp -rvf linux510/drivers/interconnect/qcom/* kernel54/drivers/interconnect/qcom/
          cp -rvf linux510/include/dt-bindings/* kernel54/include/dt-bindings/
          # 优先从本地 sparse-checkout 拷贝（避免 raw.githubusercontent 429 限流）
          if [ -f linux510/include/linux/power_supply.h ]; then
            cp -f linux510/include/linux/power_supply.h kernel54/include/linux/power_supply.h
          else
            curl --fail --show-error --location --retry 3 --max-time 60 -o kernel54/include/linux/power_supply.h "https://raw.githubusercontent.com/torvalds/linux/v5.10/include/linux/power_supply.h" || \
            curl --fail --show-error --location --retry 3 --max-time 60 -o kernel54/include/linux/power_supply.h "https://cdn.jsdelivr.net/gh/torvalds/linux@v5.10/include/linux/power_supply.h" || (echo "::error::Failed to fetch power_supply.h" && exit 1)
          fi

      - name: Fetch 4.19 peripherals
        run: |
          set -Eeuo pipefail
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          for dir in "drivers/input/misc/aw8697_haptic:aw8697_haptic" "drivers/power/supply/cas_qcom:cas_qcom"; do
            SRC=$(echo $dir | cut -d: -f1)
            DEST="port_4_19/$(echo $dir | cut -d: -f2)"
            mkdir -p "$DEST"
            curl --fail --show-error --silent --location --max-time 60 -o api.json "https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents/$SRC?ref=cas-q-oss" || (echo "::error::Failed to fetch API for $SRC" && exit 1)
            python3 -c "import json; [print(i['name']) for i in json.load(open('api.json')) if i['type'] == 'file']" | while read f; do
              curl --fail --show-error --silent --location --max-time 60 -o "$DEST/$f" "$BASE/$SRC/$f" || (echo "::error::Failed to download $f" && exit 1)
            done
            rm -f api.json
          done

      - name: Fetch qcom headers
        run: |
          set -Eeuo pipefail
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          mkdir -p include/linux/qpnp
          for h in qpnp-revid.h qpnp-smb5.h qpnp-fg.h qpnp-adc.h qpnp-qg.h qpnp-smb2.h qpnp-flash.h; do
            curl --fail --show-error --silent --location --max-time 60 -o "include/linux/qpnp/$h" "$BASE/include/linux/qpnp/$h" || true
          done
          curl --fail --show-error --silent --location --max-time 60 -o include/linux/pmic-voter.h "$BASE/include/linux/pmic-voter.h" || true

      - name: Patch 4.19 APIs
        run: |
          set -Eeuo pipefail
          cd $GITHUB_WORKSPACE/kernel54
          find port_4_19 -name "*.c" -exec sed -i 's/wakeup_source_register("/wakeup_source_register(NULL, "/g' {} \;
          find port_4_19 -name "*.c" -exec sed -i 's|asm/uaccess.h|linux/uaccess.h|g' {} \;
          for file in $(find port_4_19 -name "*.c"); do
            if grep -q "do_gettimeofday" "$file"; then
              sed -i '1i #include <linux/time64.h>\n#include <linux/ktime.h>\n#include <linux/timekeeping.h>\n#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)' "$file"
            fi
          done

      - name: Integrate into kernel tree
        run: |
          set -Eeuo pipefail
          cd $GITHUB_WORKSPACE/kernel54
          mkdir -p drivers/port_4_19
          cp -rf port_4_19/* drivers/port_4_19/
          rm -rf port_4_19
          
          # 把原生 Kconfig 引入系统
          if ! grep -q "port_4_19" drivers/Makefile; then
            echo 'obj-y += port_4_19/' >> drivers/Makefile
          fi
          if ! grep -q "port_4_19" drivers/Kconfig; then
            echo 'source "drivers/port_4_19/Kconfig"' >> drivers/Kconfig
          fi
          
          # port_4_19/Kconfig 引入子目录
          cat > drivers/port_4_19/Kconfig << 'EOF'
          source "drivers/port_4_19/cas_qcom/Kconfig"
          source "drivers/port_4_19/aw8697_haptic/Kconfig"
          EOF
          
          # port_4_19/Makefile 自动进入子目录
          cat > drivers/port_4_19/Makefile << 'EOF'
          obj-y += cas_qcom/
          obj-y += aw8697_haptic/
          EOF

      - name: Config and Build
        run: |
          set -Eeuo pipefail
          cd $GITHUB_WORKSPACE/kernel54
          touch build.log
          
          make ARCH=arm64 gki_defconfig
          
          # 精确打开三个外设开关，关闭包含 battery.c 的 SMB5 开关
          echo 'CONFIG_CHARGER_BQ25790=y' >> .config
          echo 'CONFIG_FUEL_GAUGE_BQ28Z610=y' >> .config
          echo 'CONFIG_CP_MAX77932=y' >> .config
          echo '# CONFIG_QPNP_SMB5_CAS is not set' >> .config
          
          echo 'CONFIG_INPUT_AW8697_HAPTIC=y' >> .config
          echo 'CONFIG_I2C=y' >> .config
          echo 'CONFIG_POWER_SUPPLY=y' >> .config
          echo 'CONFIG_INPUT=y' >> .config
          echo 'CONFIG_INPUT_MISC=y' >> .config
          echo 'CONFIG_SCSI=y' >> .config
          echo 'CONFIG_SCSI_UFSHCD=y' >> .config
          echo '# CONFIG_HID_PLAYSTATION is not set' >> .config
          make ARCH=arm64 olddefconfig
          
          set +e
          make ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- -j4 Image > build.log 2>&1
          RESULT=$?
          
          if [ $RESULT -ne 0 ]; then
            echo "=== 编译失败，提取最后 50 行日志 ==="
            grep -i -B 2 -A 5 "error:" build.log | head -80
            exit 1
          fi
          echo "✅ 编译成功！"

      - name: Upload Image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image_cas_core
          path: kernel54/arch/arm64/boot/Image
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel54/build.log
          retention-days: 7
          if-no-files-found: ignore
