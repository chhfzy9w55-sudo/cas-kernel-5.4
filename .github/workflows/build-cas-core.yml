name: build-cas-core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev device-tree-compiler python3 python3-pip xz-utils
          sudo apt-get install -y clang-14 lld-14 llvm-14
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Clone 5.4 kernel
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 -b android11-5.4 https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/kernel/common.git kernel54

      - name: Clone 5.10 core drivers
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth=1 --filter=blob:none --sparse -b v5.10 https://github.com/torvalds/linux.git linux510
          cd linux510
          git sparse-checkout set drivers/scsi/ufs drivers/clk/qcom drivers/interconnect/qcom include/dt-bindings

      - name: Overlay 5.10 core into 5.4
        run: |
          cd $GITHUB_WORKSPACE
          cp -rvf linux510/drivers/scsi/ufs/* kernel54/drivers/scsi/ufs/
          cp -rvf linux510/drivers/clk/qcom/* kernel54/drivers/clk/qcom/
          cp -rvf linux510/drivers/interconnect/qcom/* kernel54/drivers/interconnect/qcom/
          cp -rvf linux510/include/dt-bindings/* kernel54/include/dt-bindings/

      - name: Fetch 4.19 peripherals
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          for dir in "drivers/input/misc/aw8697_haptic:aw8697_haptic" "drivers/power/supply/cas_qcom:cas_qcom"; do
            SRC=$(echo $dir | cut -d: -f1)
            DEST="port_4_19/$(echo $dir | cut -d: -f2)"
            mkdir -p "$DEST"
            API_URL="https://api.github.com/repos/MiCode/Xiaomi_Kernel_OpenSource/contents/$SRC?ref=cas-q-oss"
            curl -sL "$API_URL" | grep '"name"' | awk -F'"' '{print $4}' | while read f; do
              curl -sL --max-time 60 -o "$DEST/$f" "$BASE/$SRC/$f" 2>/dev/null
            done
          done

      - name: Fetch qcom headers
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          BASE="https://raw.githubusercontent.com/MiCode/Xiaomi_Kernel_OpenSource/cas-q-oss"
          mkdir -p include/linux/qpnp
          for h in qpnp-revid.h qpnp-smb5.h qpnp-fg.h qpnp-adc.h qpnp-qg.h qpnp-smb2.h qpnp-flash.h; do
            curl -sL --max-time 60 -o "include/linux/qpnp/$h" "$BASE/include/linux/qpnp/$h" 2>/dev/null || true
          done
          curl -sL --max-time 60 -o include/linux/pmic-voter.h "$BASE/include/linux/pmic-voter.h" 2>/dev/null || true

      - name: Build Local Driver Compat Layer
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          
          # 生成纯净隔离的兼容头
          cat > port_4_19/xiaomi_compat.h << 'HEADER_EOF'
#ifndef _XIAOMI_419_COMPAT_H
#define _XIAOMI_419_COMPAT_H

#include <linux/power_supply.h>
#include <linux/time64.h>
#include <linux/ktime.h>
#include <linux/timekeeping.h>

#define POWER_SUPPLY_CHARGE_TYPE_TAPER 200
#define POWER_SUPPLY_PROP_CHIP_OK 201
#define POWER_SUPPLY_PROP_CHARGING_ENABLED 202
#define POWER_SUPPLY_PROP_USB_CURRENT_NOW 203
#define POWER_SUPPLY_PROP_USB_VOLTAGE_NOW 204
#define POWER_SUPPLY_PROP_HIZ_MODE 205
#define POWER_SUPPLY_PROP_CHARGE_DONE 206
#define POWER_SUPPLY_PROP_MAIN_FCC_MAX 207
#define POWER_SUPPLY_PROP_ARTI_VBUS_ENABLE 208
#define POWER_SUPPLY_PROP_TERMINATION_CURRENT 209
#define POWER_SUPPLY_PROP_INPUT_VOLTAGE_REGULATION 210
#define POWER_SUPPLY_PROP_FORCE_MAIN_ICL 211
#define POWER_SUPPLY_PROP_RECHARGE_VBAT 212
#define POWER_SUPPLY_PROP_FFC_TERMINATION_CURRENT 213
#define POWER_SUPPLY_PROP_FCC_DELTA 214
#define POWER_SUPPLY_PROP_SHUTDOWN_DELAY 215
#define POWER_SUPPLY_PROP_CAPACITY_RAW 216
#define POWER_SUPPLY_PROP_SOC_DECIMAL 217
#define POWER_SUPPLY_PROP_SOC_DECIMAL_RATE 218
#define POWER_SUPPLY_PROP_COLD_THERMAL_LEVEL 219
#define POWER_SUPPLY_PROP_RESISTANCE_ID 220
#define POWER_SUPPLY_PROP_UPDATE_NOW 221
#define POWER_SUPPLY_PROP_RESISTANCE 222
#define POWER_SUPPLY_PROP_FASTCHARGE_MODE 223
#define POWER_SUPPLY_PROP_SOH 224
#define POWER_SUPPLY_PROP_INPUT_CURRENT_SETTLED 225
#define POWER_SUPPLY_PROP_PARALLEL_MODE 226
#define POWER_SUPPLY_PROP_PARALLEL_OUTPUT_MODE 227
#define POWER_SUPPLY_PL_OUTPUT_VPH 228
#define POWER_SUPPLY_PROP_REAL_TYPE 229
#define POWER_SUPPLY_PL_USBIN_USBIN 230
#define POWER_SUPPLY_PL_USBIN_USBIN_EXT 231
#define POWER_SUPPLY_PROP_HVDCP3_TYPE 232
#define POWER_SUPPLY_PROP_DIV_2_MODE 233
#define POWER_SUPPLY_TYPE_PARALLEL 234

#define do_gettimeofday(tv) do { struct timespec64 _ts; ktime_get_real_ts64(&_ts); (tv)->tv_sec = _ts.tv_sec; (tv)->tv_usec = _ts.tv_nsec / 1000; } while (0)

#endif
HEADER_EOF

          for file in $(find port_4_19 -name "*.c"); do
            sed -i '1i #include "../xiaomi_compat.h"' "$file"
            sed -i 's/wakeup_source_register("/wakeup_source_register(NULL, "/g' "$file"
            sed -i 's|asm/uaccess.h|linux/uaccess.h|g' "$file"
          done

      - name: HARDCODE Makefiles
        run: |
          cd $GITHUB_WORKSPACE/kernel54
          mkdir -p drivers/port_4_19
          if [ -d port_4_19 ]; then
            cp -rf port_4_19/* drivers/port_4_19/
            rm -rf port_4_19
          fi
          
          if ! grep -q "port_4_19" drivers/Makefile; then
            echo 'obj-y += port_4_19/' >> drivers/Makefile
          fi

          mkdir -p drivers/port_4_19/ufs drivers/port_4_19/clk_qcom drivers/port_4_19/ic_qcom drivers/port_4_19/cas_qcom drivers/port_4_19/aw8697_haptic

          for d in ufs clk_qcom ic_qcom; do
            cd drivers/port_4_19/$d
            rm -f Makefile
            for f in *.c; do [ -f "$f" ] && echo "obj-y += ${f%.c}.o" >> Makefile; done
            touch Makefile
            cd $GITHUB_WORKSPACE/kernel54
          done
          
          # 彻底剔除 battery.c 和 bq25790_charger.c，只保留最基础的
          cd drivers/port_4_19/cas_qcom
          rm -f Makefile
          echo 'obj-y += bq27z561_fg.o' > Makefile
          echo 'obj-y += max77932.o' >> Makefile
          cd $GITHUB_WORKSPACE/kernel54
          
          echo 'obj-y += aw8697.o' > drivers/port_4_19/aw8697_haptic/Makefile

          echo 'obj-y += aw8697_haptic/' > drivers/port_4_19/Makefile
          echo 'obj-y += cas_qcom/' >> drivers/port_4_19/Makefile
          echo 'obj-y += ufs/' >> drivers/port_4_19/Makefile
          echo 'obj-y += clk_qcom/' >> drivers/port_4_19/Makefile
          echo 'obj-y += ic_qcom/' >> drivers/port_4_19/Makefile

      - name: Config and Build
        run: |
          set +e
          cd $GITHUB_WORKSPACE/kernel54
          make ARCH=arm64 gki_defconfig
          echo 'CONFIG_I2C=y' >> .config
          echo 'CONFIG_POWER_SUPPLY=y' >> .config
          echo 'CONFIG_INPUT=y' >> .config
          echo 'CONFIG_INPUT_MISC=y' >> .config
          echo 'CONFIG_SCSI=y' >> .config
          echo 'CONFIG_SCSI_UFSHCD=y' >> .config
          echo '# CONFIG_HID_PLAYSTATION is not set' >> .config
          make ARCH=arm64 olddefconfig
          
          make ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- -j4 Image > build.log 2>&1
          
          if [ $? -ne 0 ]; then
            echo "=== 编译失败，提取最后 50 行日志 ==="
            grep -i -B 2 -A 5 "error:" build.log | head -80
            exit 1
          fi

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Image_cas_core
          path: kernel54/arch/arm64/boot/Image
          retention-days: 30

      - name: Commit Image
        run: |
          cp kernel54/arch/arm64/boot/Image ./Image_cas_5.4_core
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add Image_cas_5.4_core
          git commit -m "ci: add 5.4 core image (safest subset)" || true
          git push || true
